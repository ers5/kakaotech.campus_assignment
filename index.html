<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="todo-app">
      <header class="todo-header">
        <h1>Todo</h1>
        <p>오늘의 할 일을 간단하게 관리해보세요.</p>
      </header>

      <section class="date-navigation" aria-label="날짜 이동">
        <button id="previousDateButton" class="date-button" type="button">이전</button>
        <p id="selectedDateText" class="selected-date-text" aria-live="polite"></p>
        <button id="nextDateButton" class="date-button" type="button">다음</button>
      </section>

      <section class="todo-input-section" aria-label="Todo 입력 영역">
        <label for="todoInput" class="visually-hidden">할 일 입력</label>
        <input
          id="todoInput"
          class="todo-input"
          type="text"
          placeholder="할 일을 입력하세요"
          maxlength="100"
        />
        <button id="addTodoButton" class="add-button" type="button">추가</button>
      </section>

      <p id="inputMessage" class="input-message" role="status" aria-live="polite"></p>

      <section class="filter-section" aria-label="Todo 필터">
        <button class="filter-button active" type="button" data-filter="all">전체</button>
        <button class="filter-button" type="button" data-filter="active">진행 중</button>
        <button class="filter-button" type="button" data-filter="completed">완료</button>
      </section>

      <ul id="todoList" class="todo-list" aria-label="Todo 목록"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
